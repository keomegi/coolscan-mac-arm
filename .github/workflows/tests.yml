# Runs the tests on GitHub's Linux machines after every push (cheaper than its Macs: Mac minutes count 10x on a private repo). No scanner there: the app's pretend scanner stands in.
# notify.py and test mode are kept out of git, so their tests are skipped here (they run on your Mac).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install what the tests need
        run: python -m pip install -r requirements-dev.txt

      - name: Install nkscan (only to check the calls the app makes still exist)
        continue-on-error: true
        run: python -m pip install nkscan

      - name: Does it load (every file compiles, every module imports, the app starts)
        run: python -m pytest -m quick

      - name: All the checks
        run: python -m pytest -m "not quick"
