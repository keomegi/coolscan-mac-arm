[pytest]
# python -m pytest            the whole suite (a pretend scanner; no LS-40, no nkscan needed)
# python -m pytest -m quick   only "does it load": every file compiles, every module imports, the app starts
testpaths = checks
python_files = test_*.py
# checks/scripts and checks/page hold the older check scripts; checks/test_checks.py and test_pages.py run them
norecursedirs = scripts page __pycache__ .venv
markers =
    quick: fast load-and-start checks (seconds)
    page: drives the page in a browser (needs node and the playwright package; skipped without them)
addopts = -ra
